name: Build & Publish client packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - goarch: amd64
            debarch: amd64
          - goarch: arm64
            debarch: arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build .deb
        env:
          ARCH: ${{ matrix.debarch }}
        run: |
          chmod +x scripts/build-deb-client.sh
          # scripts/build-deb-client.sh picks an always-increasing version
          # (tag vX.Y.Z, or 0.<commit-count>.0+g<hash>).
          ./scripts/build-deb-client.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.debarch }}
          path: dist/*.deb

  publish:
    needs: [build-deb]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src
          fetch-depth: 0

      - name: Prepare gh-pages worktree
        working-directory: src
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages && git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add ../gh-pages origin/gh-pages
          else
            git worktree add --detach ../gh-pages
            cd ../gh-pages
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Publish apt repo
        run: |
          mkdir -p gh-pages/pool/main
          # Keep only the newest debs so Packages stays clean.
          rm -f gh-pages/pool/main/backupurvm-client_*.deb
          cp artifacts/*.deb gh-pages/pool/main/
          cd gh-pages
          dpkg-scanpackages --multiversion pool/ > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release
          cp ../src/packaging/apt/index.html .

      - name: Commit and push gh-pages
        working-directory: gh-pages
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "no package changes"
            exit 0
          fi
          git commit -m "packages: backupurvm-client deb"
          git push origin HEAD:gh-pages --force
