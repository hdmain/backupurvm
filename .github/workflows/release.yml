name: Build & Publish client packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deb:
    strategy:
      matrix:
        include:
          - goarch: amd64
            debarch: amd64
          - goarch: arm64
            debarch: arm64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install dpkg tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Build .deb
        env:
          ARCH: ${{ matrix.debarch }}
        run: |
          chmod +x scripts/build-deb-client.sh
          if [ "${{ github.ref_type }}" = "tag" ]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          else
            # Ensure Debian version starts with a digit when only a commit hash exists.
            HASH="$(git rev-parse --short HEAD)"
            if DESC="$(git describe --tags --match 'v*' 2>/dev/null)"; then
              export VERSION="${DESC#v}"
            else
              export VERSION="0.0.0+git.${HASH}"
            fi
          fi
          ./scripts/build-deb-client.sh

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.debarch }}
          path: dist/*.deb

  publish:
    needs: [build-deb]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*
          merge-multiple: true

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.deb

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Init gh-pages if missing
        run: |
          if [ ! -d gh-pages/.git ]; then
            rm -rf gh-pages
            mkdir gh-pages
            cd gh-pages
            git init
            git checkout -b gh-pages
          fi

      - name: Install repo tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils

      - name: Publish apt repo
        run: |
          mkdir -p gh-pages/pool/main
          cp artifacts/*.deb gh-pages/pool/main/
          cd gh-pages
          dpkg-scanpackages --multiversion pool/ > Packages
          gzip -k -f Packages
          apt-ftparchive release . > Release

      - name: Write install page
        run: |
          cat > gh-pages/index.html <<'EOF'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8"/>
            <title>backupurvm packages</title>
            <style>
              body{font-family:monospace;max-width:820px;margin:40px auto;background:#0d1117;color:#c9d1d9;line-height:1.5}
              h1,h2{color:#58a6ff} pre{background:#161b22;padding:16px;border-radius:6px;overflow-x:auto}
              a{color:#79c0ff}
            </style>
          </head>
          <body>
            <h1>backupurvm — client packages</h1>
            <p>Source: <a href="https://github.com/hdmain/backupurvm">github.com/hdmain/backupurvm</a></p>
            <h2>Debian / Ubuntu (apt)</h2>
            <pre>echo "deb [trusted=yes] https://hdmain.github.io/backupurvm ./" \
  | sudo tee /etc/apt/sources.list.d/backupurvm.list
sudo apt update
sudo apt install backupurvm-client

# configure agent
sudo nano /etc/backupurvm/client.env
sudo nano /etc/backupurvm/backup.key
sudo systemctl enable --now backupurvm-client
sudo journalctl -u backupurvm-client -f</pre>
          </body>
          </html>
          EOF

      - name: Commit & push gh-pages
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "packages: backupurvm-client deb"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages --force
